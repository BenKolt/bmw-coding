<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMW F-Series | Каталог скрытых опций и кодировок</title>
    <style>
        :root {
            --bg-color: #0b0d10;
            --card-bg: #141820;
            --card-border: #1f2633;
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
            --accent-blue: #0082b6;
            --accent-dark-blue: #002554;
            --accent-red: #f91536;
            --popular-badge: #e3b341;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

        body { background-color: var(--bg-color); color: var(--text-main); line-height: 1.5; padding-bottom: 60px; }

        .m-stripes { display: flex; height: 4px; width: 100%; position: fixed; top: 0; left: 0; z-index: 100; }
        .m-stripes div { flex: 1; }
        .stripe-1 { background-color: var(--accent-blue); }
        .stripe-2 { background-color: var(--accent-dark-blue); }
        .stripe-3 { background-color: var(--accent-red); }

        header { padding: 50px 20px 25px; text-align: center; border-bottom: 1px solid var(--card-border); background: linear-gradient(180deg, rgba(20,24,32,0.9) 0%, rgba(11,13,16,0) 100%); }
        header h1 { font-size: 1.8rem; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; }
        header h1 span { color: var(--accent-red); }
        header p { color: var(--text-muted); margin-top: 8px; font-size: 0.95rem; }

        .container { max-width: 800px; margin: 0 auto; padding: 20px; }

        .selector-box { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 20px; margin-bottom: 25px; }
        .selector-box label { display: block; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); margin-bottom: 12px; font-weight: 700; }

        .models-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
        .model-btn { background: #1c222d; border: 1px solid transparent; color: var(--text-main); padding: 12px 10px; border-radius: 8px; font-weight: 600; font-size: 0.95rem; cursor: pointer; transition: all 0.2s ease; text-align: center; }
        .model-btn:hover { border-color: var(--accent-blue); background: #252d3a; }
        .model-btn.active { background: var(--accent-red); border-color: var(--accent-red); color: #fff; box-shadow: 0 0 15px rgba(249, 21, 54, 0.35); }

        .model-meta { margin-top: 15px; padding-top: 15px; border-top: 1px solid var(--card-border); display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem; color: var(--text-muted); }

        .category-block { margin-bottom: 35px; }
        .category-title { font-size: 1.2rem; font-weight: 700; color: var(--text-main); margin-bottom: 15px; display: flex; align-items: center; gap: 10px; }
        .category-title.popular { color: var(--popular-badge); font-size: 1.3rem; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .category-title::before { content: ""; display: inline-block; width: 4px; height: 18px; background: var(--accent-blue); border-radius: 2px; }
        .category-title.popular::before { background: var(--popular-badge); height: 20px; }

        .options-list { display: flex; flex-direction: column; gap: 10px; }
        .option-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 8px; padding: 14px 16px; display: flex; flex-direction: column; gap: 5px; transition: border-color 0.2s; }
        .option-card.popular-card { border-left: 3px solid var(--popular-badge); }
        .option-card:hover { border-color: #38424d; }

        .option-name { font-weight: 600; font-size: 0.95rem; color: #fff; }
        .option-desc { font-size: 0.85rem; color: var(--text-muted); line-height: 1.45; }

        .info-footer { margin-top: 35px; text-align: center; font-size: 0.85rem; color: var(--text-muted); padding: 20px; border-top: 1px solid var(--card-border); }
    </style>
</head>
<body>

    <div class="m-stripes">
        <div class="stripe-1"></div>
        <div class="stripe-2"></div>
        <div class="stripe-3"></div>
    </div>

    <header>
        <h1>BMW <span>Coding</span></h1>
        <p>Полный каталог скрытых опций для кузовов F-серии</p>
    </header>

    <div class="container">
        <div class="selector-box">
            <label>Выбери кузов автомобиля</label>
            <div class="models-grid" id="modelsGrid"></div>
            
            <div class="model-meta">
                <span id="selectedModelLabel">Выбран: BMW</span>
                <span id="optionsCountLabel">Доступно опций: 0</span>
            </div>
        </div>

        <div id="catalogContainer"></div>

        <div class="info-footer">
            Кодирование осуществляется дилерским софтом (E-Sys / ISTA).<br>
            Безопасно, без потери гарантии и вскрытия штатных блоков.
        </div>
    </div>

    <script>
        const modelsData = {
            "F20 / F30": {
                name: "1 / 3 Series (F20, F30 и производные)",
                popular: [
                    { name: "Память кнопки Start-Stop", desc: "Машина запоминает, что ты отключил Start-Stop, и больше не глушит мотор сама при каждом перезапуске зажигания." },
                    { name: "Складывание зеркал с брелока (без задержки)", desc: "Зеркала складываются моментально при коротком нажатии на кнопку закрытия на ключе (не нужно зажимать и ждать 3 секунды)." },
                    { name: "Спортивная коробка передач (опция 2TB)", desc: "Алгоритм быстрых и жестких переключений АКПП, честный ручной режим без автоматического перехода вверх в отсечке и поддержка лаунч-контроля." },
                    { name: "Режим вождения Sport+", desc: "Активация режима Sport+ на приборке и кнопке режимов. Ослабляет систему стабилизации (режим DTC) для активной езды с пробуксовкой." },
                    { name: "Цифровой спидометр", desc: "Показ текущей скорости движения крупными цифрами по центру приборной панели." },
                    { name: "Спортивные приборы", desc: "Вывод шкал реальной мощности (л.с. / кВт) и крутящего момента (Нм) на центральный монитор." },
                    { name: "Отключение омывателей фар", desc: "Полное отключение полива фар. Экономит омывайку ведрами и оставляет капот чистым." },
                    { name: "Анимация M-Performance при старте", desc: "Замена стандартной заставки на экране мультимедиа на стильный логотип ///M." }
                ],
                all: [
                    { cat: "Салон, комфорт и стекла", name: "Отключение звука непристегнутого ремня", desc: "Отключает назойливый зуммер для водителя и пассажира. Индикация на приборке работает штатно, подушки безопасности активны." },
                    { cat: "Салон, комфорт и стекла", name: "Работа стеклоподъемников при открытой двери", desc: "Стекло не останавливается, если распахнуть дверь во время его автоматического подъема/опускания." },
                    { cat: "Салон, комфорт и стекла", name: "Выключение мультимедиа при открытии двери", desc: "Музыка и экран выключаются сразу после открытия водительской двери на заглушенной машине." },
                    { cat: "Салон, комфорт и стекла", name: "Комфортная посадка (Easy Entry)", desc: "Для электросидений: кресло отъезжает назад при открытии двери и возвращается в твое положение при запуске двигателя." },
                    { cat: "Салон, комфорт и стекла", name: "Запоминание рециркуляции климата", desc: "Климат-контроль запоминает последнее состояние заслонки рециркуляции." },
                    { cat: "Оптика и внешнее освещение", name: "Пункт вкл/выкл ДХО в меню монитора", desc: "Добавляет галочку в настройки автомобиля, позволяющую полностью погасить ангельские глазки при заведенном моторе." },
                    { cat: "Оптика и внешнее освещение", name: "Стробоскопы (Дальний + Туманки)", desc: "При моргании или включении дальнего света, противотуманные фары автоматически гаснут, создавая эффект стробоскопов." },
                    { cat: "Оптика и внешнее освещение", name: "Туманки в режиме Cornering Lights", desc: "Мягкое включение левой или правой туманки при вращении руля на малой скорости для подсветки поворотов и дворов." },
                    { cat: "Оптика и внешнее освещение", name: "Моргание поворотников 5 раз вместо 3", desc: "При легком касании рычага поворотник моргает 5 раз (удобно для перестроения на трассе)." },
                    { cat: "Оптика и внешнее освещение", name: "Яркость ангельских глазок на 100% при ближнем", desc: "Кольца не притухают при включении ближнего света, а горят на максимальную яркость." },
                    { cat: "Оптика и внешнее освещение", name: "Подсветка дверных ручек при движении назад", desc: "Светодиоды в наружных ручках загораются при включении задней передачи, освещая бордюры." },
                    { cat: "Мультимедиа и приборная панель", name: "Логотип M-Performance на приборной панели", desc: "Вывод логотипа ///M в нижней части дисплея приборки (работает на расширенных приборках)." },
                    { cat: "Мультимедиа и приборная панель", name: "Рингтон телефона через колонки", desc: "Штатная аудиосистема воспроизводит мелодию твоего смартфона при звонке, а не стандартную трель BMW." },
                    { cat: "Мультимедиа и приборная панель", name: "Видео и кодеки в движении", desc: "Снятие блокировки на просмотр видео с USB-флешек во время езды (зависит от версии головного устройства)." },
                    { cat: "Мультимедиа и приборная панель", name: "Отображение температуры шин", desc: "В меню давления (RDC) дополнительно выводится точная температура каждого колеса в градусах." },
                    { cat: "Мультимедиа и приборная панель", name: "Звук постановки на охрану (пик-пик)", desc: "Звуковое подтверждение постановки и снятия с охраны при наличии штатной сигнализации." },
                    { cat: "Диагностика и сервис", name: "Комплексная диагностика ISTA+", desc: "Глубокое чтение всех блоков управления, расшифровка ошибок и удаление истории неисправностей." },
                    { cat: "Диагностика и сервис", name: "Регистрация замены аккумулятора", desc: "Прописывание нового АКБ (смена емкости и типа), сброс адаптаций датчика IBS для правильной зарядки." },
                    { cat: "Диагностика и сервис", name: "Сброс адаптаций", desc: "Сброс сервисных интервалов, адаптаций АКПП, дроссельной заслонки или Valvetronic." }
                ]
            },
            "F10": {
                name: "5 Series (F10 / F11)",
                popular: [
                    { name: "Память системы Start-Stop", desc: "Отключение навязчивого глушения двигателя. Машина запоминает нажатую кнопку." },
                    { name: "Складывание зеркал с брелока", desc: "Зеркала складываются сразу при закрытии машины с ключа (или с сенсора комфортного доступа)." },
                    { name: "Закрытие багажника с ключа/кнопки в одно касание", desc: "Для авто с электроприводом: багажник закрывается коротким нажатием с брелока или кнопки в ногах водителя (не надо стоять и держать кнопку)." },
                    { name: "Спортивная автоматическая коробка передач (2TB)", desc: "Перепрошивка алгоритма АКПП: молниеносные переключения, четкий ручной режим, поддержка лепестков." },
                    { name: "Режим вождения Sport+", desc: "Добавление режима Sport+ для отключения ошейников стабилизации и максимальной отдачи мотора." },
                    { name: "Цифровой спидометр", desc: "Точная скорость в цифрах на экране бортового компьютера." },
                    { name: "Отключение омывателя фар", desc: "Отключение форсунок оптики для экономии жидкости и чистой машины." },
                    { name: "Заставка M-Performance", desc: "Смена приветственного экрана NBT/CIC на ///M стиль." }
                ],
                all: [
                    { cat: "Салон, комфорт и багажник", name: "Отключение звука ремней безопасности", desc: "Убирает писк зуммера непристегнутых ремней при движении." },
                    { cat: "Салон, комфорт и багажник", name: "Остановка стекол при открытии двери отключена", desc: "Стеклоподъемники продолжают работу даже при открытии дверей." },
                    { cat: "Салон, комфорт и багажник", name: "Выключение магнитолы при открытии двери", desc: "Полное отключение мультимедиа, когда водитель выходит из заглушенной машины." },
                    { cat: "Салон, комфорт и багажник", name: "Комфортный выход (Easy Entry)", desc: "Руль поднимается вверх, а электросиденье отъезжает назад при открытии двери." },
                    { cat: "Салон, комфорт и багажник", name: "Память подогрева сидений (24 часа)", desc: "Если заглушил машину ненадолго, подогрев не придется включать заново." },
                    { cat: "Оптика и внешнее освещение", name: "Яркость колец DRL на 100% при габаритах/ближнем", desc: "Ангельские глазки не приглушают свет ночью." },
                    { cat: "Оптика и внешнее освещение", name: "Подсветка поворотов (Cornering Lights)", desc: "При повороте руля или включении поворотника плавно загорается туманка с нужной стороны." },
                    { cat: "Оптика и внешнее освещение", name: "Стробоскопы", desc: "Туманки отключаются в момент моргания дальним светом." },
                    { cat: "Оптика и внешнее освещение", name: "Задние габариты работают днем", desc: "Задние LED-полосы горят всегда вместе с передними ходовыми огнями." },
                    { cat: "Мультимедиа и звук", name: "Спортивные приборы", desc: "Шкалы мощности и крутящего момента на центральном дисплее." },
                    { cat: "Мультимедиа и звук", name: "Логотип M-Performance на приборке", desc: "Вывод эмблемы на дисплее щитка приборов (для Black Panel / 6WA)." },
                    { cat: "Мультимедиа и звук", name: "Температура и давление в шинах", desc: "Показ фактического давления (bar) и градусов в каждом колесе в меню RDC." },
                    { cat: "Мультимедиа и звук", name: "Видео с USB в движении", desc: "Снятие ограничения скорости на просмотр фильмов и клипов." },
                    { cat: "Диагностика и сервис", name: "Диагностика блоков ISTA+", desc: "Чтение и сброс ошибок, глубокая проверка электроники." },
                    { cat: "Диагностика и сервис", name: "Регистрация замены АКБ", desc: "Прописка нового аккумулятора." }
                ]
            },
            "F25": {
                name: "X3 / X4 (F25, F26)",
                popular: [
                    { name: "Память кнопки Start-Stop", desc: "Запоминание последнего состояния автоматического глушения мотора." },
                    { name: "Закрытие багажника с ключа без удержания", desc: "Автоматическое закрытие багажной двери в одно касание с кнопки на брелоке или в ногах." },
                    { name: "Складывание зеркал при закрытии", desc: "Складывание лопухов сразу при блокировке замков автомобиля." },
                    { name: "Спортивная коробка (2TB) и Sport+", desc: "Активация режима 2TB для резвых переключений и разблокировка режима вождения Sport+." },
                    { name: "Цифровой спидометр", desc: "Текущая скорость цифрами на экране под тахометром." },
                    { name: "Отключение омывателя фар", desc: "Деактивация форсунок стеклоомывателя на фарах." },
                    { name: "Спортивные приборы", desc: "Индикация показателей мощности и момента на мониторе." }
                ],
                all: [
                    { cat: "Салон и комфорт", name: "Отключение зуммера ремней безопасности", desc: "Деактивация звукового оповещения при непристегнутом ремне." },
                    { cat: "Салон и комфорт", name: "Выключение мультимедиа при выходе", desc: "Обесточивание радио и дисплея при открытии двери." },
                    { cat: "Салон и комфорт", name: "Работа стекол при открытой двери", desc: "Стеклоподъемники не прерывают ход, если распахнуть дверь." },
                    { cat: "Оптика", name: "Подсветка поворотов", desc: "Активация функции Cornering Lights через противотуманные фары." },
                    { cat: "Оптика", name: "Стробоскопы", desc: "Гашение ПТФ при включении дальнего света." },
                    { cat: "Оптика", name: "Яркость ангельских глазок", desc: "Работа колец на 100% мощности в ночном режиме." },
                    { cat: "Мультимедиа и сервис", name: "Видео в движении", desc: "Разблокировка просмотра видео." },
                    { cat: "Мультимедиа и сервис", name: "Давление и температура RDC", desc: "Детальная информация о состоянии шин на экране." },
                    { cat: "Мультимедиа и сервис", name: "Диагностика и адаптации АКБ", desc: "Чтение ошибок, регистрация замены аккумулятора." }
                ]
            }
        };

        let currentModel = "F20 / F30";

        function renderModels() {
            const grid = document.getElementById("modelsGrid");
            grid.innerHTML = "";

            Object.keys(modelsData).forEach(key => {
                const btn = document.createElement("button");
                btn.className = `model-btn ${key === currentModel ? 'active' : ''}`;
                btn.textContent = key;
                btn.onclick = () => selectModel(key);
                grid.appendChild(btn);
            });
        }

        function selectModel(key) {
            currentModel = key;
            renderModels();
            renderCatalog();
        }

        function renderCatalog() {
            const data = modelsData[currentModel];
            const totalOptions = data.popular.length + data.all.length;
            
            document.getElementById("selectedModelLabel").textContent = `Выбран: ${data.name}`;
            document.getElementById("optionsCountLabel").textContent = `Доступно опций: ${totalOptions}`;

            const container = document.getElementById("catalogContainer");
            container.innerHTML = "";

            // --- БЛОК 1: ПОПУЛЯРНОЕ ---
            if (data.popular && data.popular.length > 0) {
                const popBlock = document.createElement("div");
                popBlock.className = "category-block";
                
                const popTitle = document.createElement("div");
                popTitle.className = "category-title popular";
                popTitle.textContent = "🔥 Популярные кодировки";
                popBlock.appendChild(popTitle);

                const popList = document.createElement("div");
                popList.className = "options-list";

                data.popular.forEach(opt => {
                    const card = document.createElement("div");
                    card.className = "option-card popular-card";
                    card.innerHTML = `
                        <div class="option-name">${opt.name}</div>
                        <div class="option-desc">${opt.desc}</div>
                    `;
                    popList.appendChild(card);
                });
                
                popBlock.appendChild(popList);
                container.appendChild(popBlock);
            }

            // --- БЛОК 2: ВСЕ ОПЦИИ ПО КАТЕГОРИЯМ ---
            const categories = {};
            data.all.forEach(opt => {
                if (!categories[opt.cat]) categories[opt.cat] = [];
                categories[opt.cat].push(opt);
            });

            Object.keys(categories).forEach(catName => {
                const block = document.createElement("div");
                block.className = "category-block";

                const title = document.createElement("div");
                title.className = "category-title";
                title.textContent = catName;
                block.appendChild(title);

                const list = document.createElement("div");
                list.className = "options-list";

                categories[catName].forEach(opt => {
                    const card = document.createElement("div");
                    card.className = "option-card";
                    card.innerHTML = `
                        <div class="option-name">${opt.name}</div>
                        <div class="option-desc">${opt.desc}</div>
                    `;
                    list.appendChild(card);
                });

                block.appendChild(list);
                container.appendChild(block);
            });
        }

        // Старт
        renderModels();
        renderCatalog();
    </script>
</body>
</html>
