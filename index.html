<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMW F-Series Coding | Каталог скрытых опций</title>
    <style>
        :root {
            --bg-color: #0d0f12;
            --card-bg: #161b22;
            --card-border: #21262d;
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
            --accent-blue: #0082b6;
            --accent-dark-blue: #002554;
            --accent-red: #f91536;
            --accent-hover: #ff2b49;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.5;
            padding-bottom: 60px;
        }

        .m-stripes {
            display: flex;
            height: 4px;
            width: 100%;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 100;
        }
        .m-stripes div { flex: 1; }
        .stripe-1 { background-color: var(--accent-blue); }
        .stripe-2 { background-color: var(--accent-dark-blue); }
        .stripe-3 { background-color: var(--accent-red); }

        header {
            padding: 50px 20px 25px;
            text-align: center;
            border-bottom: 1px solid var(--card-border);
            background: linear-gradient(180deg, rgba(22,27,34,0.8) 0%, rgba(13,15,18,0) 100%);
        }

        header h1 {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        header h1 span {
            color: var(--accent-red);
        }

        header p {
            color: var(--text-muted);
            margin-top: 8px;
            font-size: 0.95rem;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        .selector-box {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
        }

        .selector-box label {
            display: block;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 10px;
            font-weight: 700;
        }

        .models-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 10px;
        }

        .model-btn {
            background: #21262d;
            border: 1px solid transparent;
            color: var(--text-main);
            padding: 12px 10px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .model-btn:hover {
            border-color: var(--accent-blue);
            background: #28303a;
        }

        .model-btn.active {
            background: var(--accent-red);
            border-color: var(--accent-red);
            color: #fff;
            box-shadow: 0 0 15px rgba(249, 21, 54, 0.4);
        }

        .model-meta {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid var(--card-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .category-block {
            margin-bottom: 25px;
        }

        .category-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .category-title::before {
            content: "";
            display: inline-block;
            width: 4px;
            height: 18px;
            background: var(--accent-blue);
            border-radius: 2px;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 14px 16px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            transition: border-color 0.2s;
        }

        .option-card:hover {
            border-color: #38424d;
        }

        .option-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 10px;
        }

        .option-name {
            font-weight: 600;
            font-size: 0.95rem;
            color: #fff;
        }

        .option-badge {
            font-size: 0.75rem;
            padding: 2px 6px;
            border-radius: 4px;
            background: #21262d;
            color: var(--text-muted);
            white-space: nowrap;
        }

        .option-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .info-footer {
            margin-top: 30px;
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
            padding: 20px;
            border-top: 1px solid var(--card-border);
        }
    </style>
</head>
<body>

    <div class="m-stripes">
        <div class="stripe-1"></div>
        <div class="stripe-2"></div>
        <div class="stripe-3"></div>
    </div>

    <header>
        <h1>BMW <span>Coding</span></h1>
        <p>Каталог скрытых параметров и кодировок для F-кузовов</p>
    </header>

    <div class="container">
        
        <div class="selector-box">
            <label>Выбери кузов автомобиля</label>
            <div class="models-grid" id="modelsGrid"></div>
            
            <div class="model-meta">
                <span id="selectedModelLabel">Выбран: BMW 1 Series</span>
                <span id="optionsCountLabel">Доступно опций: 0</span>
            </div>
        </div>

        <div id="catalogContainer"></div>

        <div class="info-footer">
            Кодирование осуществляется через E-Sys / ISTA+ по протоколу ENET.<br>
            Конфигурация заводских блоков без вмешательства в алгоритмы безопасности.
        </div>

    </div>

    <script>
        const modelsData = {
            "F20": {
                name: "1 Series (F20/F21)",
                years: "2011–2019",
                options: [
                    { cat: "Комфорт и салон", name: "Память системы Start-Stop", desc: "Запоминает последнее состояние кнопки выключения двигателя (не активируется автоматически при старте).", badge: "FEM_BODY" },
                    { cat: "Комфорт и салон", name: "Складывание зеркал без задержки", desc: "Зеркала закрываются мгновенно при нажатии на закрытие на брелоке (задержка убрана в 0).", badge: "FEM_BODY" },
                    { cat: "Комфорт и салон", name: "Отключение звука непристегнутого ремня", desc: "Убирает звуковое оповещение ремня водителя и переднего пассажира (визуальная иконка остается).", badge: "ACSM" },
                    { cat: "Комфорт и салон", name: "Работа стеклоподъемников при открытой двери", desc: "Окна не прерывают подъем, если дверь открыли на ходу или на парковке.", badge: "FEM_BODY" },
                    { cat: "Оптика и освещение", name: "Пункт включения ДХО в ГУ", desc: "Добавляет в меню экрана пункт активации/отключения дневных ходовых огней.", badge: "HU_ENTRY / NBT" },
                    { cat: "Оптика и освещение", name: "Отключение омывателей фар", desc: "Экономит жидкость омывателя, исключает распыл на капот при включенном ближнем.", badge: "FEM_BODY" },
                    { cat: "Оптика и освещение", name: "Плавное разгорание подсветки ручек", desc: "Мягкий свет подсветки наружных ручек при включении задней передачи для подсветки бордюров.", badge: "FEM_BODY" },
                    { cat: "Приборная панель и ГУ", name: "Цифровой спидометр", desc: "Показ фактической скорости цифрами по центру штатной приборной панели (БК).", badge: "KOMBI" },
                    { cat: "Приборная панель и ГУ", name: "Спортивные приборы", desc: "Индикаторы крутящего момента (Нм) и мощности (л.с. / кВт) на центральном мониторе.", badge: "HU_ENTRY / NBT" },
                    { cat: "Приборная панель и ГУ", name: "Анимация M-Performance при старте", desc: "Замена стандартной анимации включения монитора на ///M логотип.", badge: "HU_ENTRY / NBT" },
                    { cat: "Сервис и калибровка", name: "Чтение и расшифровка ошибок ISTA+", desc: "Полный опрос дилерским софтом блоков с анализом причин возникновения ошибок.", badge: "Диагностика" },
                    { cat: "Сервис и калибровка", name: "Регистрация замены АКБ", desc: "Прописка новой батареи или смена емкости/типа (AGM/кислота) для корректного заряда IBS.", badge: "DME / DDE" }
                ]
            },
            "F30": {
                name: "3 Series (F30/F31/F34)",
                years: "2011–2019",
                options: [
                    { cat: "Комфорт и салон", name: "Память системы Start-Stop", desc: "Запоминает положение кнопки отключения Start-Stop после перезапуска мотора.", badge: "FEM_BODY" },
                    { cat: "Комфорт и салон", name: "Складывание зеркал с брелока", desc: "Моментальное закрытие зеркал при постановке на охрану с ключа.", badge: "FEM_BODY" },
                    { cat: "Комфорт и салон", name: "Спортивная АКПП (2TB)", desc: "Активация режима Sport+ и алгоритма быстрых переключений для трансмиссии 8HP.", badge: "EGS / FEM" },
                    { cat: "Комфорт и салон", name: "Отключение звука зуммера ремней", desc: "Глушит акустический сигнал без отключения датчиков присутствия и подушек.", badge: "ACSM" },
                    { cat: "Оптика и освещение", name: "Туманки в режиме Cornering Lights", desc: "Подсветка поворотов соответствующей противотуманной фарой при вращении руля.", badge: "FEM_BODY" },
                    { cat: "Оптика и освещение", name: "Стробоскопы", desc: "Отключение противотуманных фар при включении или моргании дальним светом.", badge: "FEM_BODY" },
                    { cat: "Оптика и освещение", name: "Отключение омывателя фар", desc: "Полная деактивация циклического срабатывания форсунок фар.", badge: "FEM_BODY" },
                    { cat: "Приборная панель и ГУ", name: "Цифровой спидометр", desc: "Вывод точной скорости на дисплей приборного щитка.", badge: "KOMBI" },
                    { cat: "Приборная панель и ГУ", name: "Спортивные приборы и M-логотип", desc: "Отображение графиков отдачи двигателя и заставка M-Performance на старте.", badge: "HU_NBT / ENTRY" },
                    { cat: "Сервис и калибровка", name: "Регистрация замены АКБ", desc: "Сброс адаптаций системы управления питания при установке нового аккумулятора.", badge: "DME / DDE" },
                    { cat: "Сервис и калибровка", name: "Сброс сервисных интервалов и адаптаций", desc: "Корректировка межсервисных пробегов по регламенту дилера.", badge: "Диагностика" }
                ]
            },
            "F10": {
                name: "5 Series (F10/F11)",
                years: "2010–2017",
                options: [
                    { cat: "Комфорт и салон", name: "Память Start-Stop", desc: "Отключение навязчивого глушения двигателя на светофорах по умолчанию.", badge: "CAS" },
                    { cat: "Комфорт и салон", name: "Закрытие багажника с ключа", desc: "Закрытие электропривода крышки багажника коротким нажатием с кнопки пульта (без удержания).", badge: "HKL" },
                    { cat: "Комфорт и салон", name: "Складывание зеркал с ключа", desc: "Складывание зеркал одновременно с закрытием центрального замка.", badge: "FRM / CAS" },
                    { cat: "Оптика и освещение", name: "Кольца DRL на 100% яркости", desc: "Увеличение яркости свечения колец в режиме ближнего света.", badge: "FRM" },
                    { cat: "Оптика и освещение", name: "Отключение омывателя фар", desc: "Отключение форсунок омывателя передней оптики.", badge: "JBBF" },
                    { cat: "Приборная панель и ГУ", name: "Цифровой спидометр на БК", desc: "Отображение текущей скорости в цифровом виде.", badge: "KOMBI" },
                    { cat: "Приборная панель и ГУ", name: "Логотип M-Performance на приборке", desc: "Вывод эмблемы на дисплее щитка (для приборок расширенного типа 6WA).", badge: "KOMBI" },
                    { cat: "Приборная панель и ГУ", name: "Спортивные приборы", desc: "Графические датчики мощности и момента на дисплее мультимедиа.", badge: "HU_CIC / NBT" },
                    { cat: "Сервис и калибровка", name: "Регистрация замены АКБ", desc: "Прописка параметров аккумулятора в блок питания для предотвращения перезаряда.", badge: "DME / DDE" }
                ]
            },
            "F25": {
                name: "X3 (F25) / X4 (F26)",
                years: "2010–2017",
                options: [
                    { cat: "Комфорт и салон", name: "Память кнопки Start-Stop", desc: "Сохранение последнего состояния системы при перезапуске зажигания.", badge: "CAS" },
                    { cat: "Комфорт и салон", name: "Закрытие багажника с кнопки в салоне и ключа", desc: "Позволяет закрывать заднюю дверь без удерживания кнопки.", badge: "HKL" },
                    { cat: "Комфорт и салон", name: "Складывание зеркал при закрытии", desc: "Автоматическое складывание боковых зеркал при блокировке дверей.", badge: "FRM" },
                    { cat: "Оптика и освещение", name: "Отключение омывателя фар", desc: "Предотвращение чрезмерного расхода стеклоомывающей жидкости.", badge: "JBBF" },
                    { cat: "Оптика и освещение", name: "Плавное освещение поворотов туманками", desc: "Активация подсветки поворотов ПТФ на малых скоростях.", badge: "FRM" },
                    { cat: "Приборная панель и ГУ", name: "Цифровой спидометр", desc: "Электронный спидометр на экране приборной панели.", badge: "KOMBI" },
                    { cat: "Приборная панель и ГУ", name: "Спортивные приборы", desc: "Отображение текущей мощности и крутящего момента на основном мониторе.", badge: "HU_NBT / ENTRY" },
                    { cat: "Сервис и калибровка", name: "Компьютерная диагностика ISTA+", desc: "Глубокое сканирование всех электронных блоков управления и датчиков.", badge: "Диагностика" }
                ]
            }
        };

        let currentModel = "F20";

        function renderModels() {
            const grid = document.getElementById("modelsGrid");
            grid.innerHTML = "";

            Object.keys(modelsData).forEach(key => {
                const btn = document.createElement("button");
                btn.className = `model-btn ${key === currentModel ? 'active' : ''}`;
                btn.textContent = key;
                btn.onclick = () => selectModel(key);
                grid.appendChild(btn);
            });
        }

        function selectModel(key) {
            currentModel = key;
            renderModels();
            renderCatalog();
        }

        function renderCatalog() {
            const data = modelsData[currentModel];
            document.getElementById("selectedModelLabel").textContent = `Выбран: ${data.name} (${data.years})`;
            document.getElementById("optionsCountLabel").textContent = `Доступно опций: ${data.options.length}`;

            const container = document.getElementById("catalogContainer");
            container.innerHTML = "";

            // Группировка по категориям
            const categories = {};
            data.options.forEach(opt => {
                if (!categories[opt.cat]) categories[opt.cat] = [];
                categories[opt.cat].push(opt);
            });

            Object.keys(categories).forEach(catName => {
                const block = document.createElement("div");
                block.className = "category-block";

                const title = document.createElement("div");
                title.className = "category-title";
                title.textContent = catName;
                block.appendChild(title);

                const list = document.createElement("div");
                list.className = "options-list";

                categories[catName].forEach(opt => {
                    const card = document.createElement("div");
                    card.className = "option-card";
                    card.innerHTML = `
                        <div class="option-header">
                            <span class="option-name">${opt.name}</span>
                            <span class="option-badge">${opt.badge}</span>
                        </div>
                        <div class="option-desc">${opt.desc}</div>
                    `;
                    list.appendChild(card);
                });

                block.appendChild(list);
                container.appendChild(block);
            });
        }

        // Старт
        renderModels();
        renderCatalog();
    </script>
</body>
</html>
